# Dependabot: avisa de dependencias vulnerables y abre el PR que las corrige.
#
# Los PRs pasan por el mismo gate que cualquier otro (CI corre en todo PR), y los
# mergea un humano: tocan package-lock.json, que el agente no edita (CONSTITUTION P9).
#
# Las de seguridad salen apenas se publican, sin esperar al calendario. Las de
# versión se agrupan para no inundar la lista: un PR semanal de menores/parches.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Con 5, los saltos mayores sueltos llenaban el cupo y los grupos nuevos no
    # tenían dónde abrirse (#489). Los grupos ya acotan la cantidad de PRs.
    open-pull-requests-limit: 10
    labels: [dependencies]
    # Una dependencia cae en el PRIMER grupo que la nombra: los pares van antes.
    groups:
      # Pares que se exigen mutuamente: subidos por separado, `npm ci` muere con
      # ERESOLVE y el PR nace rojo sin poder arreglarse (#489).
      vitest:
        patterns: ["vitest", "@vitest/*"]
      # @puppeteer/* comparte con puppeteer las dependencias de red: por separado,
      # Dependabot generó un lockfile al que le faltaban (#494, `npm ci` EUSAGE).
      puppeteer-y-mermaid:
        patterns: ["puppeteer", "puppeteer-core", "@puppeteer/*", "@mermaid-js/mermaid-cli"]
      # Los tipos de React piden la misma mayor que React (#500, ERESOLVE).
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      menores-y-parches:
        update-types: [minor, patch]
    # Electron y Next cambian lo que el arnés protege (WebGPU, schemes, export
    # estático): sus saltos mayores se hacen a mano, con su propio PR y prueba.
    ignore:
      - dependency-name: electron
        update-types: ["version-update:semver-major"]
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      # Tailwind 4 es una migración (config nueva, otra sintaxis de clases: rompió
      # el typecheck y los tests de contraste en #495), no una actualización.
      # tailwind-merge 3 sólo entiende Tailwind 4: compila igual con la 3 pero
      # combina mal las clases, y eso el gate no lo ve. Los dos van juntos, a mano.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwind-merge
        update-types: ["version-update:semver-major"]
      # Migraciones registradas en #510, no actualizaciones:
      #  - typescript 7 es el compilador nuevo; otros paquetes fijan la 5.
      #  - zod 4 cambió la API de errores (rompe las herramientas MCP).
      #  - @types/node sigue al Node de Electron, no al último publicado.
      #  - vitest exige que coverage-v8 suba en el mismo cambio, y Dependabot no
      #    logra subirlo: el salto lo hace un humano con un `npm install` (P9).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: zod
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
