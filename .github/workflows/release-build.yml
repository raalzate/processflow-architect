name: Build and Publish Release

# Empaqueta los instaladores de escritorio (dmg · exe · AppImage) con
# electron-builder y, si el disparo fue un tag `v*`, publica UN borrador de
# release con los tres. Dos etapas a propósito: la matriz empaqueta y sube
# artefactos; un único job los baja y crea el release (ver el comentario del job
# `release`: publicar desde la matriz borraba el release por una carrera).
# En disparo manual sólo quedan los artefactos del run. NO corre en CI normal.
on:
  push:
    tags:
      - "v*" # Ej: v1.0.0
  workflow_dispatch: # Permite lanzar builds a demanda desde la UI de GitHub.

# Necesario para que softprops/action-gh-release pueda crear/editar el release
# y subir los assets del repositorio actual.
permissions:
  contents: write

# Un solo build por tag/ref a la vez (no cancelamos: un empaquetado a medias no sirve).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false # Un fallo en una plataforma no cancela las demás.
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    # Firma sólo si HAY certificado de macOS configurado. GitHub expande un secret
    # ausente a "" (cadena vacía, NO undefined) y electron-builder trata `CSC_LINK=""`
    # como "firma con este cert" → intenta importar una ruta vacía (la raíz del
    # proyecto) y revienta con "not a file". Por eso NO pasamos CSC_LINK vacío:
    # decidimos aquí, con el secret, si el paso de empaquetado firma o no.
    env:
      SIGN_MAC: ${{ secrets.CSC_LINK != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # `npm ci` es reproducible (respeta package-lock.json). Aquí SÍ corre el
      # postinstall (rebuild de módulos nativos vía electron-builder
      # install-app-deps): el empaquetado necesita los binarios nativos y de
      # Electron completos, a diferencia del job de CI que los salta.
      - name: Install dependencies
        run: npm ci

      # Compila el renderer Next.js + el proceso Electron (build/) y mueve la
      # salida estática a build/out. Ver script "build" en package.json.
      - name: Build electron app
        run: npm run build

      # --- Empaquetado FIRMADO (sólo si hay certificado de macOS) ---
      # `--publish never`: subimos los artefactos con softprops (repo actual),
      # no con el publish de electron-builder (que en package.json apunta a otro
      # repo). shell bash unifica la sintaxis en las 3 plataformas.
      - name: Package with electron-builder (signed)
        if: env.SIGN_MAC == 'true'
        shell: bash
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # --- Empaquetado SIN cert Apple (firma AD-HOC en macOS) ---
      # NO pasamos CSC_LINK (vacío dispararía una firma fallida) y desactivamos el
      # auto-descubrimiento de identidades del llavero. En Apple Silicon un binario
      # SIN NINGUNA firma sale "dañado" (arm64 exige al menos firma ad-hoc), así que
      # forzamos identidad ad-hoc (`mac.identity=-`) y apagamos hardenedRuntime
      # (sólo hace falta para notarización). Resultado: el .dmg abre con clic
      # derecho → Abrir en vez del error "está dañado". win/linux ignoran mac.*.
      - name: Package with electron-builder (ad-hoc / unsigned)
        if: env.SIGN_MAC != 'true'
        shell: bash
        run: npx electron-builder --${{ matrix.platform }} --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # Los instaladores SIEMPRE salen como artefactos del run: son la entrada
      # del job `release` (un tag) y, en un disparo manual, lo descargable.
      #
      # Los `latest*.yml` y los `.blockmap` viajan con ellos porque son lo que
      # consulta el updater de la app (#208): sin ellos el botón «Actualizar»
      # recibe un 404 y el sistema de actualización no existe, aunque el release
      # tenga los tres instaladores.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: warn
          retention-days: 30

  # El release lo crea UN SOLO job, después de la matriz.
  #
  # Antes lo creaba cada plataforma con softprops: los tres jobs arrancaban a la
  # vez, cada uno creaba un borrador para el mismo tag y dos de los tres se
  # borraban en el acto ("Removing duplicate draft release …" en los logs).
  # Funcionaba, pero ese ruido es indistinguible de un fallo real y llevó a
  # rehacer un release que ya existía (ver el gotcha del borrador invisible en
  # docs/harness/gotchas.md). Un publicador único no compite consigo mismo y el
  # log dice una sola cosa.
  release:
    name: Publish draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # El checkout va PRIMERO y no al medio: `actions/checkout` limpia el
      # workspace (`clean: true` por defecto), así que puesto después de bajar
      # los artefactos borraba `installers/` y el release nacía sin instaladores
      # —el log mostraba los 750 MB bajados y el borrador quedaba vacío—.
      #
      # El cuerpo del release vive en el repo (docs/releases/<versión>.md) y lo
      # exige la regla RELEASE del lint: así el borrador nace escrito y revisado
      # en el diff, en vez de redactarse a mano en la web al momento de publicar.
      - name: Checkout (para las notas del release)
        uses: actions/checkout@v4

      - name: Download installers from the matrix
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installers-*
          merge-multiple: true

      - name: List what will be attached
        run: ls -lh installers

      - name: Resolve release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          path="docs/releases/${version}.md"
          if [ ! -f "$path" ]; then
            echo "Faltan las notas en $path (ver docs/RELEASE.md)." >&2
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true # Coincide con releaseType: draft de package.json; revisá antes de publicar.
          # Un borrador sin instaladores es un release inútil que salía VERDE:
          # que falte un patrón es un fallo, no un detalle.
          fail_on_unmatched_files: true
          body_path: ${{ steps.notes.outputs.path }}
          # Sólo los tres formatos que electron-builder produce de verdad. El
          # `*.zip` que estaba acá no lo genera ningún target: era invisible con
          # `fail_on_unmatched_files: false` y, al ponerlo en `true`, tiraba el
          # publish con «Pattern does not match any files». Agregar un patrón acá
          # implica agregar su target en package.json → build.
          files: |
            installers/*.dmg
            installers/*.exe
            installers/*.AppImage
            installers/latest*.yml
            installers/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
