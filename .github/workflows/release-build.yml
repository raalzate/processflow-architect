name: Build and Publish Release

# Empaqueta los instaladores de escritorio (dmg · exe · AppImage) con
# electron-builder. Se dispara al empujar un tag `v*` (crea el release con los
# artefactos) o manualmente desde la pestaña Actions (sube los artefactos al run
# para descargarlos sin publicar release). NO corre en CI normal.
on:
  push:
    tags:
      - "v*" # Ej: v1.0.0
  workflow_dispatch: # Permite lanzar builds a demanda desde la UI de GitHub.

# Necesario para que softprops/action-gh-release pueda crear/editar el release
# y subir los assets del repositorio actual.
permissions:
  contents: write

# Un solo build por tag/ref a la vez (no cancelamos: un empaquetado a medias no sirve).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false # Un fallo en una plataforma no cancela las demás.
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    # Firma sólo si HAY certificado de macOS configurado. GitHub expande un secret
    # ausente a "" (cadena vacía, NO undefined) y electron-builder trata `CSC_LINK=""`
    # como "firma con este cert" → intenta importar una ruta vacía (la raíz del
    # proyecto) y revienta con "not a file". Por eso NO pasamos CSC_LINK vacío:
    # decidimos aquí, con el secret, si el paso de empaquetado firma o no.
    env:
      SIGN_MAC: ${{ secrets.CSC_LINK != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` es reproducible (respeta package-lock.json). Aquí SÍ corre el
      # postinstall (rebuild de módulos nativos vía electron-builder
      # install-app-deps): el empaquetado necesita los binarios nativos y de
      # Electron completos, a diferencia del job de CI que los salta.
      - name: Install dependencies
        run: npm ci

      # Compila el renderer Next.js + el proceso Electron (build/) y mueve la
      # salida estática a build/out. Ver script "build" en package.json.
      - name: Build electron app
        run: npm run build

      # --- Empaquetado FIRMADO (sólo si hay certificado de macOS) ---
      # `--publish never`: subimos los artefactos con softprops (repo actual),
      # no con el publish de electron-builder (que en package.json apunta a otro
      # repo). shell bash unifica la sintaxis en las 3 plataformas.
      - name: Package with electron-builder (signed)
        if: env.SIGN_MAC == 'true'
        shell: bash
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # --- Empaquetado SIN FIRMAR (por defecto: sin secrets de cert) ---
      # NO pasamos CSC_LINK (vacío dispararía una firma fallida) y desactivamos
      # el auto-descubrimiento de identidades del llavero del runner. Genera
      # builds sin firmar, válidos para pruebas/instalación manual.
      - name: Package with electron-builder (unsigned)
        if: env.SIGN_MAC != 'true'
        shell: bash
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # Disparo manual (sin tag): no hay release al que subir, así que dejamos
      # los instaladores como artefactos del run (descargables 30 días).
      - name: Upload build artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.zip
          if-no-files-found: warn
          retention-days: 30

      # Disparo por tag: crea (o actualiza) el release y adjunta los assets de
      # esta plataforma. Cada job de la matriz añade los suyos al mismo release.
      - name: Publish to GitHub Release (tag runs)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true # Coincide con releaseType: draft de package.json; revisá antes de publicar.
          fail_on_unmatched_files: false
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
