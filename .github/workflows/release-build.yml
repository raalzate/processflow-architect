name: Build and Publish Release

on:
  push:
    tags:
      - "v*"        # Ej: v1.0.0

permissions:
  contents: write   # Necesario para subir assets al release

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build electron app
        run: npm run build

      - name: Package with electron-builder
        run: npx electron-builder --$([ "${{ matrix.os }}" == "windows-latest" ] && echo "win" || echo "mac")
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
