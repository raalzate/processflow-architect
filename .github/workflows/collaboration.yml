name: Native collaboration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run collaboration:prepare-native
      - name: Kit SDD local e integridad (offline)
        run: npx vitest run scripts/__tests__/sdd-integrity.test.ts
      - run: npm run harness:selftest
      - run: npm run test:collaboration
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Relay propio local con binario oficial
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/pf-relay"
          gh release download v1.4.1 --repo n0-computer/iroh --pattern 'iroh-relay-v1.4.1-x86_64-unknown-linux-gnu.tar.gz' --dir "$RUNNER_TEMP/pf-relay"
          tar -xzf "$RUNNER_TEMP/pf-relay/iroh-relay-v1.4.1-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP/pf-relay"
          relay_binary=$(find "$RUNNER_TEMP/pf-relay" -type f -name iroh-relay | head -n 1)
          "$relay_binary" --dev > "$RUNNER_TEMP/pf-relay/relay.log" 2>&1 &
          relay_pid=$!
          trap 'kill "$relay_pid"' EXIT
          npx tsx scripts/collaboration-relay-smoke.ts 'http://[::1]:3340'
          # Proceso dedicado sin UDP: asegura relay sostenido, no un P2P local camuflado.
          sudo useradd --system --no-create-home pf-relay-test
          test_uid=$(id -u pf-relay-test)
          sudo iptables -I OUTPUT -m owner --uid-owner "$test_uid" -p udp -j DROP
          sudo ip6tables -I OUTPUT -m owner --uid-owner "$test_uid" -p udp -j DROP
          # Dos tramos de relay de 30 ms cada uno, con variación, en un runner efímero.
          sudo tc qdisc add dev lo root netem delay 30ms 5ms rate 20mbit
          trap 'sudo tc qdisc del dev lo root; sudo iptables -D OUTPUT -m owner --uid-owner "$test_uid" -p udp -j DROP; sudo ip6tables -D OUTPUT -m owner --uid-owner "$test_uid" -p udp -j DROP; kill "$relay_pid"' EXIT
          sudo install -d -m 0777 "$RUNNER_TEMP/pf-load-results"
          sudo -u pf-relay-test env PATH="$PATH" node --import tsx scripts/collaboration-load.ts "$RUNNER_TEMP/pf-load-results/relay.json" 20 'http://[::1]:3340'
      - name: Resultados de carga por relay
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relay-load
          path: ${{ runner.temp }}/pf-load-results/*.json
          if-no-files-found: warn
