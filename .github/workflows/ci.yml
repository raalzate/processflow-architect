name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela ejecuciones previas del mismo ref cuando llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Un solo job, porque hay una sola definición de "entregable": scripts/gate.sh.
  # Lo corren los tres actores con el mismo comando — humano, agente (subagente
  # gate-runner) y CI. Si CI corriera otra cosa, el verde local dejaría de significar algo.
  gate:
    name: Gate (arnés · docs · lint · typecheck · tests · build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # `npm ci` instala desde package-lock.json (reproducible).
      # --ignore-scripts salta el postinstall (electron-builder install-app-deps,
      # rebuild de módulos nativos) que no hace falta para el gate.
      # ELECTRON_SKIP_BINARY_DOWNLOAD / PUPPETEER_SKIP_DOWNLOAD evitan bajar binarios pesados.
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PUPPETEER_SKIP_DOWNLOAD: 1

      # El self-test reporta el kit de SDD como "omitido" cuando $CI está presente:
      # esas skills viven en la máquina del desarrollador, no en el repo.
      - name: Gate
        run: npm run gate

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
