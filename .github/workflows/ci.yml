name: CI

on:
  push:
    branches: [main]
  # Sin filtro de rama A PROPÓSITO: el gate corre en TODO pull request, apunte a
  # donde apunte. Un PR apilado (base = otra rama, lo normal cuando dos cambios
  # tocan los mismos archivos) no ejecutaba nada, y como la rama protegida exige
  # este check en verde, quedaba imposible de mergear hasta empujarle algo. El
  # `push` sí se queda en `main`: las demás ramas ya vienen cubiertas por su PR y
  # con las dos se pagaría el runner dos veces por el mismo commit.
  pull_request:

# Cancela ejecuciones previas del mismo ref cuando llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Un solo job, porque hay una sola definición de "entregable": scripts/gate.sh.
  # Lo corren los tres actores con el mismo comando — humano, agente (subagente
  # gate-runner) y CI. Si CI corriera otra cosa, el verde local dejaría de significar algo.
  gate:
    name: Gate (arnés · docs · lint · typecheck · tests · build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # `npm ci` instala desde package-lock.json (reproducible).
      # --ignore-scripts salta el postinstall (electron-builder install-app-deps,
      # rebuild de módulos nativos) que no hace falta para el gate.
      # ELECTRON_SKIP_BINARY_DOWNLOAD / PUPPETEER_SKIP_DOWNLOAD evitan bajar binarios pesados.
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PUPPETEER_SKIP_DOWNLOAD: 1

      # El self-test reporta el kit de SDD como "omitido" cuando $CI está presente:
      # esas skills viven en la máquina del desarrollador, no en el repo.
      - name: Gate
        run: npm run gate

      # El panel del arnés de esta corrida, como artefacto (docs/panel.md). Corre aunque el gate
      # salga rojo: es justo cuando más sirve mirarlo. En CI `gh` no tiene sesión, así que el
      # burn-down sale «sin dato» con su error, nunca como un plan en cero.
      - name: Panel del arnés
        if: always()
        run: node scripts/panel/generar.mjs --salida "${{ runner.temp }}/panel"

      - name: Upload panel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-del-arnes
          path: ${{ runner.temp }}/panel
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # Vulnerabilidades conocidas en las dependencias que viajan en el instalador.
  # Job APARTE y que no bloquea, a propósito: el día que se agregó había 30
  # altas/críticas cuya corrección cambia package-lock.json (ruta protegida: la
  # decide un humano, normalmente mergeando el PR que abre Dependabot). Un check
  # rojo permanente se aprende a ignorar; un resumen en cada run, no. Cuando el
  # conteo llegue a cero, se vuelve bloqueante y entra al gate.
  audit:
    name: Audit de dependencias (informativo)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: npm audit (producción)
        run: |
          {
            echo "## npm audit — dependencias de producción"
            echo
            npm audit --omit=dev --json 2>/dev/null \
              | node -e "const a=JSON.parse(require('fs').readFileSync(0,'utf8'));const v=a.metadata?.vulnerabilities??{};console.log('| crítica | alta | moderada | baja |');console.log('|---|---|---|---|');console.log('| '+[v.critical,v.high,v.moderate,v.low].map(n=>n??0).join(' | ')+' |')"
            echo
            echo "Detalle: \`npm audit --omit=dev\`. Las correcciones llegan como PRs de Dependabot."
          } >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev --audit-level=high
